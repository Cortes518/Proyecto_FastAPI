<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Control de Aforo</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
    <!-- Librería para detección de rostros en tiempo real -->
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="#" class="navbar-brand">🎯 Control de Aforo</a>
        <div class="navbar-nav">
            <span>Bienvenido, <strong>{{ user.username }}</strong></span>
            <a href="{% url 'settings' %}"> Configuración</a>
            <a href="{% url 'logout' %}">Cerrar Sesión</a>
        </div>
    </nav>

    <!-- Main Grid -->
    <main class="dashboard-grid">
        
        <!-- Panel Izquierdo: Cámara -->
        <section class="card">
            <h2 class="card-title">📹 Stream en Vivo</h2>
            
            <!-- Contenedor relativo para superponer video y canvas -->
            <div class="camera-container">
                <video id="video" autoplay playsinline muted></video>
                <canvas id="canvas"></canvas>
            </div>

            <!-- Botones de Control -->
            <div style="margin-top: 1rem; display: flex; gap: 0.5rem; justify-content: center;">
                <button class="btn btn-primary" id="startBtn" onclick="startCamera()">
                    Iniciar Cámara
                </button>
                <button class="btn btn-danger" id="stopBtn" onclick="stopCamera()" disabled>
                    Detener
                </button>
                <button class="btn btn-success" id="captureBtn" onclick="captureFrame()" disabled>
                    📸 Capturar Foto
                </button>
            </div>

            <!-- Log de Eventos -->
            <div id="log-container" class="log-area" style="margin-top: 1rem;">
                <div class="log-entry">[Sistema] Esperando inicio de cámara...</div>
            </div>
        </section>

        <!-- Panel Derecho: Estadísticas y Métricas -->
        <section class="card">
            <h2 class="card-title">📊 Métricas de Aforo</h2>

            <div id="messageContainer"></div>

            <!-- Contador Principal -->
            <div style="margin: 2rem 0;">
                <div class="count-display" id="peopleCount">0</div>
                <div class="count-label">Personas Detectadas</div>
            </div>

            <!-- Información del Estado -->
            <div style="background-color: #0a0a1a; padding: 1rem; border-radius: 8px; border: 1px solid #0f3460; margin-bottom: 1.5rem;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <span>Estado Actual:</span>
                    <span id="statusBadge" class="status-badge status-ok">OK</span>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; color: #a0a0b0;">
                    <span>Límite Máximo:</span>
                    <strong id="maxAllowed" style="color: #fff;">-</strong>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: #a0a0b0; margin-top: 0.5rem;">
                    <span>Última Captura:</span>
                    <span id="lastCapture">-</span>
                </div>
            </div>

            <!-- Formulario para Ajustar Límite -->
            <div class="form-group">
                <label for="thresholdInput">Modificar Límite Permitido</label>
                <div style="display: flex; gap: 0.5rem;">
                    <input type="number" id="thresholdInput" class="form-control" min="1" max="500" placeholder="Ej: 15">
                    <button class="btn btn-warning" onclick="updateThreshold()">Actualizar</button>
                </div>
            </div>
        </section>

    </main>

    <!-- Archivos JavaScript de la App -->
    <script src="{% static 'js/camera.js' %}"></script>
    <script src="{% static 'js/api.js' %}"></script>

    <!-- Funciones Auxiliares de Interfaz -->
    <script>
        function addLog(message) {
            const logContainer = document.getElementById('log-container');
            const timestamp = new Date().toLocaleTimeString('es-CO');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = `[${timestamp}] ${message}`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function showMessage(message, type) {
            const container = document.getElementById('messageContainer');
            const alertClass = type === 'error' ? 'alert-error' : type === 'warning' ? 'alert-warning' : 'alert-success';
            container.innerHTML = `<div class="alert ${alertClass}">${message}</div>`;
            setTimeout(() => { container.innerHTML = ''; }, 4000);
        }

        function updateUI(result) {
            document.getElementById('peopleCount').textContent = result.people_count;
            document.getElementById('maxAllowed').textContent = result.max_allowed;
            
            if (result.timestamp) {
                document.getElementById('lastCapture').textContent = new Date(result.timestamp).toLocaleTimeString('es-CO');
            }

            const badge = document.getElementById('statusBadge');
            badge.textContent = result.status;
            
            if (result.status === 'OK') {
                badge.className = 'status-badge status-ok';
            } else if (result.status === 'WARNING') {
                badge.className = 'status-badge status-warning';
            } else {
                badge.className = 'status-badge status-critical';
            }
        }
    </script>
</body>
</html>
