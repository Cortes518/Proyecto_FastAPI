<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Control de Aforo</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1 class="card-title" style="text-align: center; font-size: 1.8rem; margin-bottom: 0.5rem;">
                 Crear Cuenta
            </h1>
            <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.8rem;">
                Completa el formulario para registrarte
            </p>

            {% if error %}
            <div class="alert alert-error">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="{% url 'register' %}">
                {% csrf_token %}

                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form-control" 
                        required 
                        autofocus
                        placeholder="Elige un nombre de usuario"
                    >
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-control" 
                        required
                        placeholder="tu@correo.com"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-control" 
                        required
                        placeholder="••••••••"
                    >
                </div>

                <div class="form-group">
                    <label for="password_confirm">Confirmar Contraseña</label>
                    <input 
                        type="password" 
                        id="password_confirm" 
                        name="password_confirm" 
                        class="form-control" 
                        required
                        placeholder="••••••••"
                    >
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.75rem;">
                    Registrarse
                </button>
            </form>

            <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">
                ¿Ya tienes una cuenta? 
                <a href="{% url 'login' %}" style="color: var(--primary-cherry); font-weight: 600; text-decoration: none;">
                    Iniciar sesión
                </a>
            </p>
        </div>
    </div>
</body>
</html>
